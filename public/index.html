<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big Dawg's Castle</title>
  <style>
    :root {
      --bg: #17161a;
      --panel: #222127;
      --text: #e8e2d4;
      --muted: #9b9486;
      --accent: #f0d98c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    main { width: 100%; max-width: 780px; }
    .play { display: flex; gap: 12px; align-items: flex-start; }
    .room { flex: 1 1 auto; min-width: 0; }
    .side { flex: 0 0 180px; }
    .side h2 { font-size: 0.85rem; color: var(--muted); margin: 0 0 6px; font-weight: normal; }
    #world-map { width: 100%; image-rendering: auto; border: 1px solid #3a3842; }
    @media (max-width: 640px) { .play { flex-direction: column; } .side { flex-basis: auto; width: 100%; } #world-map { max-width: 220px; } }
    h1 { font-size: 1.1rem; color: var(--accent); margin: 0 0 8px; font-weight: normal; letter-spacing: 0.04em; }
    #map { display: block; width: 100%; height: auto; image-rendering: pixelated; border: 2px solid #000; }
    #log {
      background: var(--panel);
      height: 180px;
      overflow-y: auto;
      padding: 8px 10px;
      margin-top: 8px;
      font-size: 0.95rem;
      line-height: 1.35;
    }
    #log p { margin: 0 0 4px; }
    #log p.you { color: var(--muted); }
    #command {
      width: 100%;
      margin-top: 6px;
      padding: 8px 10px;
      font: inherit;
      background: var(--panel);
      color: var(--text);
      border: 1px solid #3a3842;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="room-name"></h1>
    <div class="play">
      <div class="room"><canvas id="map"></canvas></div>
      <div class="side">
        <h2>Explored rooms</h2>
        <canvas id="world-map" width="180" height="180"></canvas>
      </div>
    </div>
    <div id="log"></div>
    <input id="command" placeholder="Type a command, e.g. north or look" autocomplete="off">
  </main>
  <script src="main.js"></script>
</body>
</html>
